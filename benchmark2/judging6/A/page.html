<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>File upload</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #f4f7fb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at top left, #e7edff 0, transparent 34%),
        #f4f7fb;
    }

    button,
    input {
      font: inherit;
    }

    .upload-card {
      width: min(100%, 620px);
      padding: 32px;
      border: 1px solid #e4e9f2;
      border-radius: 20px;
      background: #ffffff;
      box-shadow: 0 18px 50px rgb(31 48 82 / 10%);
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.55rem, 4vw, 2rem);
      line-height: 1.2;
    }

    .intro {
      margin: 0 0 24px;
      color: #687289;
    }

    .drop-zone {
      min-height: 180px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 28px;
      border: 2px dashed #9faccc;
      border-radius: 16px;
      background: #f8faff;
      color: #52607a;
      text-align: center;
      cursor: pointer;
      transition: border-color 160ms ease, background 160ms ease, transform 160ms ease;
    }

    .drop-zone:hover,
    .drop-zone:focus-visible {
      border-color: #4e6ee8;
      background: #f1f4ff;
      outline: none;
    }

    .drop-zone.is-dragging {
      border-color: #3558df;
      background: #e9eeff;
      transform: scale(1.01);
    }

    .upload-icon {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #e4eaff;
      color: #3558df;
      font-size: 1.5rem;
      font-weight: 700;
    }

    .drop-zone strong {
      color: #26334e;
      font-size: 1.05rem;
    }

    .drop-zone small {
      color: #7a8499;
    }

    #file-input {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .file-section {
      margin-top: 24px;
    }

    .file-section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 12px;
    }

    h2 {
      margin: 0;
      font-size: 1rem;
    }

    .clear-button,
    .remove-button {
      border: 0;
      background: transparent;
      color: #c2384f;
      cursor: pointer;
    }

    .clear-button {
      padding: 6px 0;
      font-weight: 650;
    }

    .clear-button:hover:not(:disabled),
    .remove-button:hover {
      color: #8f1f34;
      text-decoration: underline;
    }

    .clear-button:disabled {
      color: #aeb5c2;
      cursor: not-allowed;
    }

    .file-list {
      display: grid;
      gap: 10px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .empty-state {
      margin: 0;
      padding: 18px;
      border: 1px solid #e8ebf1;
      border-radius: 12px;
      color: #7a8499;
      text-align: center;
    }

    .file-item {
      padding: 14px;
      border: 1px solid #e4e8f0;
      border-radius: 12px;
      background: #fbfcfe;
    }

    .file-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: start;
      gap: 12px;
    }

    .file-name {
      display: block;
      overflow: hidden;
      color: #26334e;
      font-weight: 650;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .file-meta {
      display: flex;
      gap: 10px;
      margin-top: 3px;
      color: #747e92;
      font-size: 0.85rem;
    }

    .file-status[data-state="done"] {
      color: #16805a;
      font-weight: 700;
    }

    .remove-button {
      padding: 2px 0 2px 8px;
      font-size: 0.875rem;
      font-weight: 650;
    }

    .progress-track {
      height: 7px;
      margin-top: 12px;
      overflow: hidden;
      border-radius: 999px;
      background: #e7eaf1;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #5576ee, #7557df);
    }

    .actions {
      margin-top: 20px;
    }

    .upload-button {
      width: 100%;
      min-height: 48px;
      border: 0;
      border-radius: 12px;
      background: #405fd8;
      color: #ffffff;
      font-weight: 750;
      cursor: pointer;
      box-shadow: 0 8px 18px rgb(64 95 216 / 22%);
      transition: background 150ms ease, transform 150ms ease, box-shadow 150ms ease;
    }

    .upload-button:hover:not(:disabled) {
      background: #3452c8;
      transform: translateY(-1px);
      box-shadow: 0 10px 22px rgb(64 95 216 / 28%);
    }

    .upload-button:focus-visible,
    .clear-button:focus-visible,
    .remove-button:focus-visible {
      outline: 3px solid rgb(64 95 216 / 28%);
      outline-offset: 2px;
    }

    .upload-button:disabled {
      background: #aeb8d5;
      cursor: not-allowed;
      box-shadow: none;
    }

    @media (max-width: 520px) {
      body {
        padding: 12px;
      }

      .upload-card {
        padding: 22px 18px;
        border-radius: 16px;
      }

      .drop-zone {
        min-height: 160px;
        padding: 22px 16px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="upload-card">
    <h1>Upload files</h1>
    <p class="intro">Add one or more files, then upload them when you are ready.</p>

    <div id="drop-zone" class="drop-zone" role="button" tabindex="0" aria-controls="file-input" aria-label="Choose files or drop files here">
      <span class="upload-icon" aria-hidden="true">↑</span>
      <strong>Drop files here or click to browse</strong>
      <small>You can select multiple files</small>
      <input id="file-input" type="file" multiple>
    </div>

    <section class="file-section" aria-labelledby="file-heading">
      <div class="file-section-header">
        <h2 id="file-heading">Selected files</h2>
        <button id="clear-all" class="clear-button" type="button" disabled>Clear all</button>
      </div>
      <p id="empty-state" class="empty-state">No files selected.</p>
      <ul id="file-list" class="file-list" aria-live="polite"></ul>
    </section>

    <div class="actions">
      <button id="upload-button" class="upload-button" type="button" disabled>Upload</button>
    </div>
  </main>

  <script>
    (() => {
      const dropZone = document.getElementById('drop-zone');
      const fileInput = document.getElementById('file-input');
      const fileList = document.getElementById('file-list');
      const emptyState = document.getElementById('empty-state');
      const uploadButton = document.getElementById('upload-button');
      const clearButton = document.getElementById('clear-all');

      let nextId = 1;
      let files = [];
      let isUploading = false;
      let dragDepth = 0;

      function formatKilobytes(bytes) {
        return `${(bytes / 1024).toFixed(1)} KB`;
      }

      function addFiles(fileCollection) {
        const additions = Array.from(fileCollection, (file) => ({
          id: nextId++,
          file,
          progress: 0,
          status: 'Ready'
        }));

        files.push(...additions);
        render();
      }

      function render() {
        const fragment = document.createDocumentFragment();

        files.forEach((entry) => {
          const item = document.createElement('li');
          item.className = 'file-item';
          item.dataset.fileId = String(entry.id);

          const row = document.createElement('div');
          row.className = 'file-row';

          const details = document.createElement('div');
          const name = document.createElement('span');
          name.className = 'file-name';
          name.textContent = entry.file.name;
          name.title = entry.file.name;

          const meta = document.createElement('div');
          meta.className = 'file-meta';

          const size = document.createElement('span');
          size.textContent = formatKilobytes(entry.file.size);

          const status = document.createElement('span');
          status.className = 'file-status';
          status.dataset.state = entry.status.toLowerCase();
          status.textContent = entry.status === 'Uploading' ? `${Math.round(entry.progress)}%` : entry.status;

          meta.append(size, status);
          details.append(name, meta);

          const removeButton = document.createElement('button');
          removeButton.className = 'remove-button';
          removeButton.type = 'button';
          removeButton.dataset.removeId = String(entry.id);
          removeButton.setAttribute('aria-label', `Remove ${entry.file.name}`);
          removeButton.textContent = 'Remove';

          row.append(details, removeButton);

          const progressTrack = document.createElement('div');
          progressTrack.className = 'progress-track';
          progressTrack.setAttribute('role', 'progressbar');
          progressTrack.setAttribute('aria-label', `Upload progress for ${entry.file.name}`);
          progressTrack.setAttribute('aria-valuemin', '0');
          progressTrack.setAttribute('aria-valuemax', '100');
          progressTrack.setAttribute('aria-valuenow', String(Math.round(entry.progress)));

          const progressBar = document.createElement('div');
          progressBar.className = 'progress-bar';
          progressBar.style.width = `${entry.progress}%`;
          progressTrack.append(progressBar);

          item.append(row, progressTrack);
          fragment.append(item);
        });

        fileList.replaceChildren(fragment);
        emptyState.hidden = files.length > 0;
        clearButton.disabled = files.length === 0;
        uploadButton.disabled = isUploading || !files.some((entry) => entry.status !== 'Done');
        uploadButton.textContent = isUploading ? 'Uploading…' : 'Upload';
      }

      function openFilePicker() {
        fileInput.click();
      }

      dropZone.addEventListener('click', (event) => {
        if (event.target !== fileInput) {
          openFilePicker();
        }
      });

      dropZone.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          openFilePicker();
        }
      });

      fileInput.addEventListener('change', () => {
        addFiles(fileInput.files);
        fileInput.value = '';
      });

      dropZone.addEventListener('dragenter', (event) => {
        event.preventDefault();
        dragDepth += 1;
        dropZone.classList.add('is-dragging');
      });

      dropZone.addEventListener('dragover', (event) => {
        event.preventDefault();
        if (event.dataTransfer) {
          event.dataTransfer.dropEffect = 'copy';
        }
      });

      dropZone.addEventListener('dragleave', (event) => {
        event.preventDefault();
        dragDepth = Math.max(0, dragDepth - 1);
        if (dragDepth === 0) {
          dropZone.classList.remove('is-dragging');
        }
      });

      dropZone.addEventListener('drop', (event) => {
        event.preventDefault();
        dragDepth = 0;
        dropZone.classList.remove('is-dragging');
        if (event.dataTransfer) {
          addFiles(event.dataTransfer.files);
        }
      });

      fileList.addEventListener('click', (event) => {
        const removeButton = event.target.closest('[data-remove-id]');
        if (!removeButton) {
          return;
        }

        const id = Number(removeButton.dataset.removeId);
        files = files.filter((entry) => entry.id !== id);
        render();
      });

      clearButton.addEventListener('click', () => {
        files = [];
        render();
      });

      uploadButton.addEventListener('click', () => {
        if (isUploading) {
          return;
        }

        const uploadIds = new Set(
          files.filter((entry) => entry.status !== 'Done').map((entry) => entry.id)
        );

        if (uploadIds.size === 0) {
          return;
        }

        isUploading = true;
        files.forEach((entry) => {
          if (uploadIds.has(entry.id)) {
            entry.progress = 0;
            entry.status = 'Uploading';
          }
        });
        render();

        const duration = 2000;
        const startedAt = performance.now();

        function updateProgress(now) {
          const progress = Math.min(100, ((now - startedAt) / duration) * 100);

          files.forEach((entry) => {
            if (uploadIds.has(entry.id)) {
              entry.progress = progress;
              entry.status = progress === 100 ? 'Done' : 'Uploading';
            }
          });
          render();

          if (progress < 100) {
            requestAnimationFrame(updateProgress);
          } else {
            isUploading = false;
            render();
          }
        }

        requestAnimationFrame(updateProgress);
      });
    })();
  </script>
</body>
</html>
